<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <!-- Add Bootstrap CSS (via CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4" style="max-width: 400px; width: 100%;">
            <h1 class="text-center mb-4">Welcome, {{ username }}</h1>
            <div class="text-center">
                <a href="/logout/" class="btn btn-danger w-100 mb-2">Logout</a>
                {% if is_superuser %}
                    <a href="/admin_panel/" class="btn btn-primary w-100">Admin Dashboard</a>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Add Bootstrap JS and dependencies (via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
